[package]
name = "spendguard"
version = "0.1.0"
edition = "2021"
description = "On-chain spend policy for AI agents"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "spendguard"

[dependencies]
solana-program = "=1.18.26"
spl-token = { version = "=4.0.0", features = ["no-entrypoint"] }

# Pinned on purpose: newer releases of the hashing/derive stack (block-buffer 0.12, zeroize_derive 1.5) declare
# edition2024, which the SBF toolchain's cargo (1.75/1.79) refuses. Constraining them here keeps the resolver on
# the 2021-era line that compiles for SBPF.
sha2 = "=0.10.8"
digest = "=0.10.7"
block-buffer = "=0.10.4"
zeroize = "=1.3.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
